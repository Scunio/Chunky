# Set minimo e volutamente conservativo: il codice esistente non è mai passato da un linter,
# quindi attivare tutto in blocco produrrebbe centinaia di warning e renderebbe `--strict`
# inutilizzabile in CI. Le regole si alzano fase per fase, non tutte insieme.

included:
  - Sources
  - Tests

excluded:
  - Tests/ChunkyTests/Fixtures
  - .build
  - Chunky.xcodeproj

# Regole disattivate perché il codice attuale le viola in modo diffuso e sistemarle
# adesso significherebbe un diff enorme scollegato dal lavoro su macOS.
# Vanno riattivate una alla volta nelle fasi successive (vedi il piano).
disabled_rules:
  - line_length
  - todo
  - trailing_whitespace
  - identifier_name
  - type_name
  - nesting
  - function_body_length
  # Idioma SwiftUI standard (Button { } label: { }, Section { } header: { }): il codice lo usa
  # ovunque e "correggerlo" peggiorerebbe la leggibilità.
  - multiple_closures_with_trailing_closure
  - cyclomatic_complexity
  - large_tuple

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - redundant_optional_initialization
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
  - force_unwrapping

# `ReaderView.swift` (1600+ righe) e `LibraryView.swift` (681) restano segnalati di proposito:
# la loro scomposizione è P3/P4 del piano, e il warning è il promemoria.
file_length:
  warning: 400
  error: 2000

type_body_length:
  warning: 350
  error: 1200

function_parameter_count:
  warning: 6
  error: 8

# Classi di bug vere: queste sì bloccano la CI (oggi zero violazioni).
force_cast: error
force_try: error
force_unwrapping: error
