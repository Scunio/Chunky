name: Nightly (UI test)

# Gli UI test hanno bisogno dell'app firmata e avviata: sono lenti e più fragili dei test
# unitari, quindi non girano a ogni PR.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ui-tests:
    name: UI test ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            scheme: ChunkyUI_macOS
            destination: platform=macOS,arch=arm64
          - name: iOS
            scheme: ChunkyUI_iOS
            destination: platform=iOS Simulator,name=iPhone 16,OS=latest

    steps:
      - uses: actions/checkout@v4

      - name: Seleziona Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto
        run: xcodegen generate

      - name: UI test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Chunky.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath "build/ui-${{ matrix.name }}.xcresult" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM=""

      - name: Salva il result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcresult-${{ matrix.name }}
          path: build/ui-${{ matrix.name }}.xcresult
