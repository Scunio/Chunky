name: Nightly (UI test)

# Gli UI test hanno bisogno dell'app firmata e avviata: sono lenti e più fragili dei test
# unitari, quindi non girano a ogni PR.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ui-tests:
    name: UI test ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            scheme: ChunkyUI_macOS
            destination: platform=macOS,arch=arm64
            simulatorFamily: ""
          - name: iOS
            scheme: ChunkyUI_iOS
            destination: ""
            simulatorFamily: iPhone
          # L'iPad non è ridondante: senza notch, nascondere la status bar porta l'inset
          # superiore a zero invece di lasciarlo all'altezza del notch, quindi i difetti di
          # safe area nel reader si vedono qui e quasi non si vedono su iPhone.
          - name: iPadOS
            scheme: ChunkyUI_iOS
            destination: ""
            simulatorFamily: iPad Pro

    steps:
      - uses: actions/checkout@v4

      - name: Seleziona Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto
        run: xcodegen generate

      # I nomi dei simulatori cambiano tra le immagini dei runner, quindi fissarne uno rende
      # il job rosso per l'immagine e non per il codice. Qui si sceglie il modello più recente
      # della famiglia richiesta, e se non ce n'è nessuno si fallisce dicendo cosa c'era.
      - name: Risolvi la destinazione
        run: |
          set -euo pipefail
          family="${{ matrix.simulatorFamily }}"
          if [ -z "$family" ]; then
            echo "DESTINATION=${{ matrix.destination }}" >> "$GITHUB_ENV"
            exit 0
          fi
          # Dal JSON e non dall'output testuale: i nomi dei modelli contengono parentesi
          # ("iPad Pro 13-inch (M5)") e troncherebbero qualunque parsing fermo alla prima.
          # Ordinato sul numero di modello, non alfabeticamente: in ordine alfabetico
          # "iPhone SE" batte "iPhone 17", e l'SE non ha il notch — cioè si perderebbe proprio
          # il caso in cui l'inset superiore non va a zero nascondendo la status bar.
          name=$(xcrun simctl list devices available -j \
            | jq -r --arg f "$family" '[.devices | to_entries[]
                | select(.key | test("iOS")) | .value[]
                | select(.name | startswith($f)) | .name]
              | unique
              | map({name: ., model: (try (capture("(?<d>[0-9]+)").d | tonumber) catch -1)})
              | sort_by(.model, .name) | last | .name // empty')
          if [ -z "$name" ]; then
            echo "::error::Nessun simulatore disponibile per la famiglia '$family'"
            xcrun simctl list devices available
            exit 1
          fi
          # Lo stesso nome esiste in più runtime: si prende il simulatore del runtime più
          # recente, confrontando le versioni come numeri ("18-10" dopo "18-5").
          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg n "$name" '[.devices | to_entries[]
                | select(.key | test("iOS")) | .key as $rt | .value[]
                | select(.name == $n)
                | {udid, v: ($rt | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))}]
              | sort_by(.v) | last | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::Nessun UDID per il simulatore '$name'"
            exit 1
          fi
          echo "Simulatore scelto: $name ($udid)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          # Per UDID e non per nome: i test devono girare sul simulatore acceso al passo dopo.
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      # Se è xcodebuild ad accendere il simulatore, il primo test paga i lavori di primo
      # avvio del sistema: il 27/11 sull'iPad l'app non ha segnalato l'idle per 60s e
      # XCTest ha rinunciato al lancio, mentre gli altri 4 test sono passati. Acceso qui e
      # atteso fino al boot completo, il primo test trova un simulatore già a regime.
      - name: Accendi il simulatore
        if: env.SIMULATOR_UDID != ''
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID" || true  # già acceso non è un errore
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: UI test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Chunky.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "$DESTINATION" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath "build/ui-${{ matrix.name }}.xcresult" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM=""

      - name: Salva il result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcresult-${{ matrix.name }}
          path: build/ui-${{ matrix.name }}.xcresult
