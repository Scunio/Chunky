name: Chunky
options:
  bundleIdPrefix: com.scunio
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  createIntermediateGroups: true

# Impostazioni di firma a livello di progetto: i target le ereditano tutti. Il file committato
# non contiene dati personali, include solo (in modo opzionale) Signing.local.xcconfig, che ogni
# sviluppatore si crea con il proprio Team ID e che è gitignorato.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  Unrar:
    url: https://github.com/mtgto/Unrar.swift.git
    from: 0.3.15
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    from: 4.0.0

# ---------------------------------------------------------------------------
# Due target espliciti invece di un unico target multipiattaforma: è l'unico modo
# per dare a iOS e macOS un Info.plist e degli entitlements distinti. Con il target
# unico, il bundle Mac riceveva UILaunchScreen, UISupportedInterfaceOrientations,
# UIBackgroundModes e TARGETED_DEVICE_FAMILY, che su macOS non significano nulla.
# `Scripts/verify-plists.sh` verifica che non ci tornino dentro.
#
# I nomi Chunky_iOS / Chunky_macOS replicano quelli che XcodeGen generava prima,
# così schemi, comandi e CI restano invariati.
# ---------------------------------------------------------------------------
targetTemplates:
  # I test unitari NON sono ospitati nell'app: compilano direttamente i sorgenti sotto test
  # (escluso il punto d'ingresso @main). Ospitarli nell'app richiederebbe di firmarla, e con
  # gli entitlement iCloud servirebbe un provisioning profile che la CI non ha; in più ogni
  # run dovrebbe lanciare la UI. Così i test sono ermetici, veloci e girano ovunque.
  # Conseguenza: i test vivono nello stesso modulo del codice, quindi niente
  # `@testable import Chunky`.
  ChunkyUnitTest:
    type: bundle.unit-test
    sources:
      - path: Tests/ChunkyTests
      - path: Sources/Chunky
        excludes:
          - ChunkyApp.swift
    dependencies:
      - package: ZIPFoundation
      - package: Unrar
      - package: AMSMB2
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true

  ChunkyUITest:
    type: bundle.ui-testing
    sources:
      - path: Tests/ChunkyUITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true

  ChunkyApp:
    type: application
    sources:
      - path: Sources/Chunky
    dependencies:
      - package: ZIPFoundation
      - package: Unrar
      - package: AMSMB2
    settings:
      base:
        PRODUCT_NAME: Chunky
        PRODUCT_BUNDLE_IDENTIFIER: com.scunio.Chunky
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Chunky_iOS:
    platform: iOS
    templates: [ChunkyApp]
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Chunky
        # Interpolate, non scritte a mano: l'Info.plist lo genera XcodeGen, e senza queste due
        # righe ci metterebbe i suoi valori fissi (CFBundleVersion 1). Con
        # GENERATE_INFOPLIST_FILE = NO è il plist a vincere sui build settings, quindi il
        # numero di build passato da `Scripts/release-appstore.sh` non arrivava nel bundle e
        # App Store Connect avrebbe rifiutato ogni upload dopo il primo.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Niente crittografia oltre a quella di sistema (Keychain, TLS): evita che App Store
        # Connect chieda le informazioni di conformità all'esportazione a ogni upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        # Su iOS l'apertura in place funziona davvero (Files fornisce l'URL sicuro).
        # Sul Mac sandboxed servirebbero bookmark security-scoped, che non abbiamo:
        # per questo la chiave resta solo qui.
        LSSupportsOpeningDocumentsInPlace: true
        # Espone la cartella Documents dell'app in Files e nella tab "File" del Finder
        # (device collegato via USB): ci si possono trascinare dentro i .cbz/.cbr
        # direttamente dal Mac. Chiave iOS-only, inerte su macOS: vedi
        # `LibraryStorage.adoptFilesDroppedInLocalDocuments()` per la parte che poi li
        # registra in libreria.
        UIFileSharingEnabled: true
        NSFaceIDUsageDescription: "Usa Face ID per sbloccare Chunky quando il blocco genitori è attivo."
        NSLocalNetworkUsageDescription: "Chunky usa la rete locale per ricevere fumetti caricati da un browser sullo stesso Wi-Fi."
        NSBonjourServices:
          - _smb._tcp
        NSUbiquitousContainers:
          iCloud.com.scunio.Chunky:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            NSUbiquitousContainerName: Chunky
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic Archive
            LSItemContentTypes:
              - com.scunio.chunky.cbz
              - com.scunio.chunky.cbr
              - com.adobe.pdf
            LSHandlerRank: Owner
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.scunio.chunky.cbz
            UTTypeDescription: Comic Book Zip Archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
          - UTTypeIdentifier: com.scunio.chunky.cbr
            UTTypeDescription: Comic Book RAR Archive
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
    entitlements:
      path: Support/Chunky-iOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.scunio.Chunky
        com.apple.developer.icloud-services:
          - CloudDocuments
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.scunio.Chunky"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"

  Chunky_macOS:
    platform: macOS
    templates: [ChunkyApp]
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: Chunky
        # Interpolate, non scritte a mano: l'Info.plist lo genera XcodeGen, e senza queste due
        # righe ci metterebbe i suoi valori fissi (CFBundleVersion 1). Con
        # GENERATE_INFOPLIST_FILE = NO è il plist a vincere sui build settings, quindi il
        # numero di build passato da `Scripts/release-appstore.sh` non arrivava nel bundle e
        # App Store Connect avrebbe rifiutato ogni upload dopo il primo.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Niente crittografia oltre a quella di sistema (Keychain, TLS): evita che App Store
        # Connect chieda le informazioni di conformità all'esportazione a ogni upload.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: "MIT License"
        NSLocalNetworkUsageDescription: "Chunky usa la rete locale per ricevere fumetti caricati da un browser sullo stesso Wi-Fi."
        NSBonjourServices:
          - _smb._tcp
        NSUbiquitousContainers:
          iCloud.com.scunio.Chunky:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            NSUbiquitousContainerName: Chunky
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic Archive
            LSItemContentTypes:
              - com.scunio.chunky.cbz
              - com.scunio.chunky.cbr
              - com.adobe.pdf
            LSHandlerRank: Owner
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.scunio.chunky.cbz
            UTTypeDescription: Comic Book Zip Archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
          - UTTypeIdentifier: com.scunio.chunky.cbr
            UTTypeDescription: Comic Book RAR Archive
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
    entitlements:
      path: Support/Chunky-macOS.entitlements
      properties:
        # Sandbox e file-access sono chiavi macOS: su iOS erano rumore.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.scunio.Chunky
        com.apple.developer.icloud-services:
          - CloudDocuments
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.scunio.Chunky"

  Chunky_tvOS:
    platform: tvOS
    templates: [ChunkyApp]
    info:
      path: Support/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Chunky
        # Vedi il commento gemello in Chunky_iOS/Chunky_macOS: senza queste due righe
        # XcodeGen scriverebbe CFBundleVersion 1 fisso, e Scripts/release-appstore.sh
        # non riuscirebbe a far arrivare il numero di build nel bundle.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Chunky usa la rete locale per ricevere fumetti caricati da un browser sullo stesso Wi-Fi."
        NSBonjourServices:
          - _smb._tcp
        # Niente NSUbiquitousContainers qui: è la chiave che rende il container visibile in
        # Files, e tvOS non ha un Files app né supporta l'entitlement CloudDocuments che la
        # renderebbe operativa (il profilo di provisioning lo scarta silenziosamente — vedi
        # icloud-services sotto). Su tvOS iCloud sincronizza solo i metadati via CloudKit.
        UIBackgroundModes:
          - remote-notification
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic Archive
            LSItemContentTypes:
              - com.scunio.chunky.cbz
              - com.scunio.chunky.cbr
              - com.adobe.pdf
            LSHandlerRank: Owner
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.scunio.chunky.cbz
            UTTypeDescription: Comic Book Zip Archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
          - UTTypeIdentifier: com.scunio.chunky.cbr
            UTTypeDescription: Comic Book RAR Archive
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
    entitlements:
      path: Support/Chunky-tvOS.entitlements
      properties:
        # Niente app-sandbox/network.client/network.server: sono chiavi macOS-only (il
        # sandboxing su tvOS non passa da un entitlement esplicito), Xcode le scarta in
        # fase di firma — verificato: restavano fuori dal binario firmato comunque.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.scunio.Chunky
        # Solo CloudKit: CloudDocuments (iCloud Drive/ubiquity container) non è supportato
        # su tvOS, il profilo di provisioning lo scarta silenziosamente anche se dichiarato.
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.scunio.Chunky"
        # App Store Connect rifiuta un binario tvOS con icloud-services ma senza questa
        # chiave (errore 90575). Chiave nuda "aps-environment", non "com.apple.developer.…":
        # quel prefisso è lo spelling macOS, su iOS/tvOS il profilo di provisioning concede
        # (ed Xcode confronta) la chiave senza prefisso.
        aps-environment: development
    settings:
      base:
        # tvOS usa il catalogo a icona-a-strati + Top Shelf, non il semplice "AppIcon"
        # di iOS/macOS (che non ha senso su tvOS: niente icona quadrata singola).
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  ChunkyTests_iOS:
    platform: iOS
    templates: [ChunkyUnitTest]

  ChunkyTests_macOS:
    platform: macOS
    templates: [ChunkyUnitTest]

  ChunkyTests_tvOS:
    platform: tvOS
    templates: [ChunkyUnitTest]

  ChunkyUITests_iOS:
    platform: iOS
    templates: [ChunkyUITest]
    dependencies:
      - target: Chunky_iOS

  ChunkyUITests_macOS:
    platform: macOS
    templates: [ChunkyUITest]
    dependencies:
      - target: Chunky_macOS

# Gli schemi sono dichiarati qui invece di lasciarli autocreare da Xcode: gli schemi
# autocreati vivono in xcuserdata e non sono deterministici, mentre la CI deve poter
# contare sul fatto che `-scheme Chunky_macOS` includa davvero i target di test.
schemes:
  # Lo schema principale esegue SOLO i test unitari, e la sua azione `test` non costruisce
  # l'app: i test unitari non ne hanno bisogno, e costruire l'app in fase di test
  # richiederebbe un provisioning profile per gli entitlement iCloud (che la CI non ha).
  Chunky_iOS:
    build:
      targets:
        Chunky_iOS: [run, archive, profile, analyze]
        ChunkyTests_iOS: [test]
    test:
      gatherCoverageData: true
      targets: [ChunkyTests_iOS]
    run:
      config: Debug

  Chunky_macOS:
    build:
      targets:
        Chunky_macOS: [run, archive, profile, analyze]
        ChunkyTests_macOS: [test]
    test:
      gatherCoverageData: true
      targets: [ChunkyTests_macOS]
    run:
      config: Debug

  Chunky_tvOS:
    build:
      targets:
        Chunky_tvOS: [run, archive, profile, analyze]
        ChunkyTests_tvOS: [test]
    test:
      gatherCoverageData: true
      targets: [ChunkyTests_tvOS]
    run:
      config: Debug

  # Gli UI test hanno bisogno dell'app vera (quindi di firma e avvio): stanno in schemi
  # separati, eseguiti dal workflow notturno e non a ogni PR.
  ChunkyUI_iOS:
    build:
      targets:
        Chunky_iOS: all
        ChunkyUITests_iOS: [test]
    test:
      targets: [ChunkyUITests_iOS]

  ChunkyUI_macOS:
    build:
      targets:
        Chunky_macOS: all
        ChunkyUITests_macOS: [test]
    test:
      targets: [ChunkyUITests_macOS]
